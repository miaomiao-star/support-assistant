<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>小喵 · 喵喵精选客服</title>
<!-- 页面分三层：顶部身份信息、中间滚动消息区、底部输入框。纯 HTML/CSS/JS，无前端框架。 -->
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f3ef;color:#272b27;font:15px/1.7 system-ui,"Microsoft YaHei",sans-serif}main{max-width:900px;height:100dvh;margin:auto;display:flex;flex-direction:column;background:#fffdf9;border-inline:1px solid #e9e7df}header{padding:22px 28px;border-bottom:1px solid #e9e7df;display:flex;align-items:center;gap:14px}.avatar{width:46px;height:46px;display:grid;place-items:center;background:#e5eddf;border-radius:16px;font-size:25px}h1{font-size:19px;margin:0}header p{margin:0;color:#738070;font-size:12px}button{font:inherit;cursor:pointer;border:0;border-radius:12px;padding:10px 16px}#reset{margin-left:auto;background:#f0eee7;color:#596353}#messages{flex:1;overflow:auto;padding:28px;scroll-behavior:smooth}.row{display:flex;margin-bottom:20px;gap:10px;align-items:flex-start}.row.user{justify-content:flex-end}.bubble{max-width:80%;padding:13px 18px;background:#eeeee7;border-radius:3px 18px 18px 18px;white-space:pre-wrap;overflow-wrap:anywhere}.user .bubble{background:#375a46;color:white;border-radius:18px 3px 18px 18px}.label{font-size:11px;color:#758070;margin-bottom:4px}.user .label{text-align:right}.error{color:#b84438;font-size:12px;margin:8px 0}footer{padding:18px 28px 20px;border-top:1px solid #e9e7df}form{display:flex;gap:10px;align-items:flex-end;background:#f4f3ec;border:1px solid #e4e4d9;border-radius:16px;padding:10px}textarea{flex:1;resize:none;border:0;outline:0;background:transparent;font:inherit;padding:6px;min-height:48px;max-height:120px}#send{background:#375a46;color:white;min-width:76px}button:disabled{opacity:.5;cursor:default}#status{color:#828779;font-size:11px;margin:8px 4px 0}.intro{text-align:center;padding:35px 0 40px}.intro h2{font-size:25px;margin:8px}.intro p{color:#808574}.chips{display:flex;justify-content:center;gap:8px;flex-wrap:wrap}.chips button{background:#eeeee6;color:#596353;font-size:13px}@media(max-width:600px){header,#messages,footer{padding:16px}.bubble{max-width:90%}.intro{padding:20px 0}}
/* 工具轨迹放在同一气泡内；正文独立节点，逐字更新不会覆盖徽章。 */
.row>div{max-width:80%}.bubble{max-width:100%}.tool-trace{display:flex;gap:6px;flex-wrap:wrap;white-space:normal}.tool-trace:not(:empty){margin-bottom:9px}.tool-badge{font:11px/1.6 system-ui;border:1px solid #c5d5c7;background:#e5eee4;color:#365b42;border-radius:20px;padding:3px 9px}.tool-badge[data-status="running"]{background:#fff2d7;border-color:#e6d3a5;color:#82601e}.tool-badge[data-status="error"]{background:#fae9e4;color:#9c3c31;border-color:#e5beb4}@media(max-width:600px){.row>div{max-width:90%}}
</style></head><body><main><header><div class="avatar">🐱</div><div><h1>小喵客服</h1><p>喵喵精选 · 购物与售后咨询</p></div><button id="reset" type="button">新对话</button></header>
<section id="messages" aria-label="聊天记录"><div class="intro"><div style="font-size:40px">🐾</div><h2>你好，我是小喵</h2><p>购物有疑问？告诉我，我来帮你理清楚。</p><div class="chips"><button type="button">订单 1001 的物流到哪了</button><button type="button">退货政策是什么</button><button type="button">邮费是多少</button></div></div></section>
<footer><form id="form"><textarea id="input" aria-label="输入消息" placeholder="输入你的问题…" rows="1" required></textarea><button id="send">发送 ↗</button></form><p id="status" role="status">Enter 发送 · Shift + Enter 换行 · 具体售后以平台规则为准</p></footer></main>
<!-- 使用同源 POST /api/chat；密钥只保留在后端，不传到浏览器。 -->
<script>
// 缓存 DOM 元素，减少后续重复查找。
const messages=document.querySelector('#messages'),input=document.querySelector('#input'),send=document.querySelector('#send'),reset=document.querySelector('#reset'),status=document.querySelector('#status');
// 同一页面会话重复发送同一个 session_id，历史由服务端保存。
// 刷新或点新对话会生成新 ID；这是会话标识，不是鉴权令牌。
let session=crypto.randomUUID(),busy=false;
// 创建消息节点；textContent 把模型内容当文本，避免作为 HTML 执行。
// 当前没有 Markdown 渲染，因此 ** 等标记会按原文显示。
// Ch02：气泡容器同时容纳工具轨迹和正文，但返回的是正文 span。
// 定时器仅更新 span.textContent，避免把气泡内的工具徽章一起覆盖掉。
function bubble(text,user=false){const row=document.createElement('div');row.className='row'+(user?' user':'');const wrap=document.createElement('div'),label=document.createElement('div'),body=document.createElement('div');label.className='label';label.textContent=user?'你':'小喵';body.className='bubble';const trace=document.createElement('div'),content=document.createElement('span');trace.className='tool-trace';trace.setAttribute('aria-label','工具轨迹');content.textContent=text;if(!user)body.append(trace);body.append(content);wrap.append(label,body);row.append(wrap);messages.append(row);messages.scrollTop=messages.scrollHeight;return content;}
// 发送流程：锁定发送按钮 → 显示用户消息 → 读取 SSE → 完成/报错后恢复按钮。
// busy 避免一页内同时发多轮，防止上下文先后顺序交错。
async function submit(){const text=input.value.trim();if(!text||busy)return;busy=true;send.disabled=true;reset.disabled=true;input.value='';document.querySelector('.intro')?.remove();bubble(text,true);const reply=bubble('正在思考…');let output='',buffer='',pending='',done=false,painted=false;
// 网络 chunk 可能有多个字；队列每 18ms 显示一个 Unicode 码点。
// 这是视觉打字效果，不是 tokenizer 级别的计数；组合 emoji 仍可能分开显示。
const timer=setInterval(()=>{if(pending){const chars=Array.from(pending);const next=chars.splice(0,1).join('');pending=chars.join('');output+=next;reply.textContent=output;painted=true;messages.scrollTop=messages.scrollHeight;}},18);
// 每个 SSE 事件以空行结束。收集 data 行后解码 JSON，识别 error 和 DONE。
// Ch02 状态分流：event:tool 只更新徽章，不追加到回答文字，也不终止本轮。
// 用 call_id 找本次调用的徽章，running 到 success/error 更新同一个节点。
// 工具返回 error 状态与整轮 event:error 不同：前者仍让模型组织失败说明。
// 徽章名和正文都用 textContent，模型或工具提供的字符串不会作为 HTML 执行。
function frame(raw){let event='message',data=[];for(const line of raw.split('\n')){if(line.startsWith('event:'))event=line.slice(6).trim();if(line.startsWith('data:'))data.push(line.slice(5).trimStart());}if(!data.length)return;const payload=data.join('\n');if(payload==='[DONE]'){done=true;return;}const item=JSON.parse(payload);if(event==='tool'){const trace=reply.parentElement.querySelector('.tool-trace');let badge=Array.from(trace.children).find(b=>b.dataset.callId===item.call_id);if(!badge){badge=document.createElement('span');badge.className='tool-badge';badge.dataset.callId=item.call_id;trace.append(badge);}badge.dataset.status=item.status;badge.textContent=item.name+' · '+({running:'查询中',success:'已完成',error:'未成功'}[item.status]||item.status);badge.title=item.error||item.name;if(!output&&!pending)reply.textContent=item.status==='running'?'正在执行工具…':'正在整理回答…';status.textContent=item.status==='running'?'小喵正在调用 '+item.name+'…':'工具已返回，小喵正在回答…';return;}if(event==='error'||item.error)throw Error(item.message||'回复失败，请稍后重试');if(typeof item.delta==='string')pending+=item.delta;}
status.textContent='小喵正在回复…';let reader;
// fetch 支持携带 JSON 的 POST；原生 EventSource 通常用于 GET，不适合此请求契约。
// reader.read() 的网络片段不一定是完整事件，所以用 buffer 拼接，再按空行拆帧。
// TextDecoder 的 stream 模式处理中文 UTF-8 字节被拆到不同网络片段的情况。
// 收到 DONE 后等逐字队列显示完，再允许下一轮发送。
try{const response=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({session_id:session,message:text})});if(!response.ok){let detail;try{detail=(await response.json()).detail;}catch{}throw Error(typeof detail==='string'?detail:'请求失败，请检查输入或稍后重试');}reader=response.body.getReader();const decoder=new TextDecoder();while(true){const part=await reader.read();buffer+=decoder.decode(part.value||new Uint8Array(),{stream:!part.done}).replace(/\r/g,'');let end;while((end=buffer.indexOf('\n\n'))>=0){const raw=buffer.slice(0,end);buffer=buffer.slice(end+2);frame(raw);}if(part.done)break;}if(!done)throw Error('连接中断，回复未完成，请重试');while(pending)await new Promise(r=>setTimeout(r,25));status.textContent='回复完成 · 可以继续追问';}
// 保留部分文本并显示错误；工具操作流水已保存，半截最终回复不入库。
catch(error){output+=pending;pending='';reply.textContent=output||'暂时无法回复';const note=document.createElement('p');note.className='error';note.textContent=error.message;reply.parentElement.append(note);status.textContent='本轮未完成，可重新发送';}
// 成功或失败都释放 reader 和定时器，避免按钮一直锁定。
finally{clearInterval(timer);if(reader){try{await reader.cancel();}catch{}reader.releaseLock();}busy=false;send.disabled=false;reset.disabled=false;input.focus();}}
// Enter 发送，Shift+Enter 换行；输入法正在组合文字时不触发发送。
// 新对话只换本页会话 ID，不会删除服务端旧会话数据。
document.querySelector('#form').addEventListener('submit',e=>{e.preventDefault();submit();});input.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing){e.preventDefault();submit();}});reset.addEventListener('click',()=>{session=crypto.randomUUID();messages.replaceChildren();bubble('新的对话开始啦，有什么可以帮你？');status.textContent='已开启新对话';input.focus();});document.querySelectorAll('.chips button').forEach(b=>b.onclick=()=>{input.value=b.textContent;submit();});
</script></body></html>
